<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tail Swing - Mini Pals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud" class="overlay">
      <div class="hud-top">
        <div class="hud-box" id="hud-level">Level 1</div>
        <div class="hud-box" id="hud-coins">🪙 <span id="coin-count">0</span></div>
        <div class="hud-buttons">
          <button id="btn-sound" class="icon-btn">🔊</button>
          <button id="btn-pause" class="icon-btn">⏸️</button>
        </div>
      </div>
      <div id="tutorial-msg" class="tutorial-text">Click / Tap or press SPACEBAR to Swing!</div>
    </div>

    <!-- Main Menu Overlay -->
    <div id="menu-overlay" class="overlay screen-overlay active">
      <div class="menu-card">
        <h1 class="game-title">TAIL SWING</h1>
        <p class="subtitle">Mini Pals Adventure</p>
        <div class="menu-buttons">
          <button id="btn-play" class="btn primary-btn">PLAY</button>
          <button id="btn-levels-menu" class="btn secondary-btn">LEVELS</button>
          <button id="btn-shop-menu" class="btn secondary-btn">SHOP 🐾</button>
        </div>
      </div>
    </div>

    <!-- Level Select Overlay -->
    <div id="level-overlay" class="overlay screen-overlay hidden">
      <div class="menu-card wide-card">
        <h2>SELECT LEVEL</h2>
        <div id="level-grid" class="level-grid"></div>
        <button id="btn-level-back" class="btn secondary-btn">BACK</button>
      </div>
    </div>

    <!-- Shop Overlay -->
    <div id="shop-overlay" class="overlay screen-overlay hidden">
      <div class="menu-card wide-card">
        <div class="shop-header">
          <h2>MINI PALS SHOP</h2>
          <div class="shop-coins">🪙 <span id="shop-coin-count">0</span></div>
        </div>
        <div id="shop-grid" class="shop-grid"></div>
        <button id="btn-shop-back" class="btn secondary-btn">BACK</button>
      </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-overlay" class="overlay screen-overlay hidden">
      <div class="menu-card">
        <h2>PAUSED</h2>
        <div class="menu-buttons">
          <button id="btn-resume" class="btn primary-btn">RESUME</button>
          <button id="btn-restart-pause" class="btn secondary-btn">RESTART</button>
          <button id="btn-menu-pause" class="btn secondary-btn">MAIN MENU</button>
        </div>
      </div>
    </div>

    <!-- Game Over / Win Overlay -->
    <div id="result-overlay" class="overlay screen-overlay hidden">
      <div class="menu-card">
        <h2 id="result-title">LEVEL COMPLETE!</h2>
        <p id="result-subtitle">Coins Collected: +<span id="earned-coins">0</span></p>
        <div class="menu-buttons">
          <button id="btn-next-level" class="btn primary-btn">NEXT LEVEL</button>
          <button id="btn-restart-result" class="btn secondary-btn">RETRY</button>
          <button id="btn-menu-result" class="btn secondary-btn">MAIN MENU</button>
        </div>
      </div>
    </div>
  </div>

  <script src="physics.js"></script>
  <script src="levels.js"></script>
  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
